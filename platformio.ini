	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_ROTATION=2
	-D TFT_RGB_ORDER=TFT_BGR
	-D SPI_FREQUENCY=60000000
	-D SPI_READ_FREQUENCY=6000000
	-D USER_SETUP_LOADED=1
	-D SUPPORT_TRANSACTIONS
wt32-sc01 = 
	-D ST7796_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_ROTATION=0
	-D SPI_FREQUENCY=40000000
	-D USER_SETUP_LOADED=1
featherwing-35 = 
	-D HX8357D_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_ROTATION=0
	-D SPI_FREQUENCY=27000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D SPI_READ_FREQUENCY=20000000
	-D USER_SETUP_LOADED=1
	-D TOUCH_DRIVER=0x0610
featherwing-35-v2 = 
	-D HX8357D_DRIVER=1
	-D TFT_WIDTH=320
	-D TFT_HEIGHT=480
	-D TFT_ROTATION=0
	-D SPI_FREQUENCY=27000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D SPI_READ_FREQUENCY=20000000
	-D USER_SETUP_LOADED=1
	-D TOUCH_DRIVER=0x2007
featherwing-24 = 
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_ROTATION=0
	-D SPI_FREQUENCY=27000000
	-D SPI_TOUCH_FREQUENCY=2500000
	-D SPI_READ_FREQUENCY=20000000
	-D USER_SETUP_LOADED=1
