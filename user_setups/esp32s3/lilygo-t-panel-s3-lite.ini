;***************************************************;
;     LilyGo T-Panel S3 Lite, 4-Inch (no touch)     ;
;               - ESP32-S3, 16MB / 8MB QSPI PSRAM   ;
;               - st7701s TFT, SPI init + RGB       ;
;               - No XL9535, no CST3240             ;
; Pins from Xinyuan-LilyGO/T-Panel-Lite t_panel_config.h
;***************************************************;

[lilygo-t-panel-s3-lite]
extends = arduino_esp32s3_v2
board = lilygo-t-panel-s3-lite

; Quad PSRAM: GPIO33-37 are free (BL, SPI, SD). Octal OPI would steal them.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = user_setups/esp32/partitions_16MB.csv

build_flags =
    -D HASP_MODEL="LilyGo T-Panel S3 Lite"
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    ; CDC=1 waits for a USB host; a 5 V brick never enumerates and the plate never boots.
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D HASP_USE_HTTP=1
    -D HASP_USE_TELNET=1
    -D HASP_USE_MQTT=1

;region -- ArduinoGFX build options ------------------------
    -D HASP_USE_ARDUINOGFX=1
    -D HASP_LV_USE_SW_ROTATE=1
    -D LILYGO_T_PANEL_LITE=1
    -D ST7701_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=480
    -D TFT_ROTATION=0

    ; 9-bit SPI init (shared with SD MOSI/SCLK)
    -D TFT_CS=14
    -D TFT_SCLK=36
    -D TFT_MOSI=35
    -D TFT_DC=-1
    -D TFT_MISO=-1
    -D TFT_RST=-1

    ; RGB panel — t_panel_config.h
    -D TFT_DE=38
    -D TFT_HSYNC=39
    -D TFT_VSYNC=40
    -D TFT_PCLK=41
    -D TFT_B0=1
    -D TFT_B1=2
    -D TFT_B2=3
    -D TFT_B3=4
    -D TFT_B4=5
    -D TFT_G0=6
    -D TFT_G1=7
    -D TFT_G2=8
    -D TFT_G3=9
    -D TFT_G4=10
    -D TFT_G5=11
    -D TFT_R0=12
    -D TFT_R1=13
    -D TFT_R2=42
    -D TFT_R3=46
    -D TFT_R4=45
    -D TFT_BCKL=33
    -D TFT_BACKLIGHT_ON=HIGH

    ; Timing — t_panel_config.h (6 MHz, DE mode)
    -D TFT_HSYNC_POLARITY=1
    -D TFT_HSYNC_FRONT_PORCH=20
    -D TFT_HSYNC_PULSE_WIDTH=1
    -D TFT_HSYNC_BACK_PORCH=1
    -D TFT_VSYNC_POLARITY=1
    -D TFT_VSYNC_FRONT_PORCH=30
    -D TFT_VSYNC_PULSE_WIDTH=1
    -D TFT_VSYNC_BACK_PORCH=10
    -D TFT_PCLK_ACTIVE_NEG=0
    -D TFT_PREFER_SPEED=6000000
    -D TFT_AUTO_FLUSH=1

    ; No touch on Lite
    -D TOUCH_DRIVER=-1
    -D LV_DISP_DEF_REFR_PERIOD=10
;endregion

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${arduinogfx.lib_deps}

[env:lilygo-t-panel-s3-lite]
extends = lilygo-t-panel-s3-lite, flash_16mb

[env:lilygo-t-panel-s3-lite_16MB]
extends = lilygo-t-panel-s3-lite, flash_16mb
