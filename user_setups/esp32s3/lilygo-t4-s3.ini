;***************************************************;
;        LilyGo T4-S3 2.41" AMOLED Touch            ;
;             - ESP32-S3-DevKitC-1 / BOARD_AMOLED_241 ;
;             - RM690B0 AMOLED Display (450x600 QSPI) ;
;             - CST226 Capacitive Touch Controller  ;
;***************************************************;

[lilygo-t4-s3]
extends = arduino_esp32s3_v2
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

build_flags =
    -D HASP_MODEL="LilyGo T4-S3"
    -D LILYGO_T4_S3=1
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

;region -- LovyanGFX display & touch options -------------
    -D LGFX_USE_V1=1
    -D LGFX_USE_QSPI=1
    -D RM690B0_DRIVER=1
    -D TFT_WIDTH=450
    -D TFT_HEIGHT=600
    -D TFT_OFFSET_X=16
    -D TFT_ROTATION=0
    -D SPI_FREQUENCY=80000000

    ; QSPI Display Bus Pins
    -D TFT_CS=11
    -D TFT_SCK=15
    -D TFT_D0=14
    -D TFT_D1=10
    -D TFT_D2=16
    -D TFT_D3=12
    -D TFT_RST=13
    -D TFT_BCKL=9
    -D PWR_EN=9

    ; Touch Settings
    -D TOUCH_DRIVER=0x0226
    -D HASP_USE_LGFX_TOUCH=1
    -D TOUCH_SDA=6
    -D TOUCH_SCL=7
    -D TOUCH_IRQ=8
    -D TOUCH_RST=17
    -D I2C_TOUCH_FREQUENCY=100000
    -D I2C_TOUCH_ADDRESS=0x5A

    ; SD Card Pins
    -D SD_MISO=4
    -D SD_MOSI=2
    -D SD_SCLK=3
    -D SD_CS=1
;endregion

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${lovyangfx.lib_deps}


[env:lilygo-t4-s3_16MB]
extends = lilygo-t4-s3, flash_16mb
