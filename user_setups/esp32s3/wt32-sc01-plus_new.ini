;***************************************************;
;         WT32 SC01 Plus with TFT 3.5"              ;
;               - Custom esp32-s3 board             ;
;               - st7796 TFT                        ;
;               - ft6336 touch controller           ;
;***************************************************;

[wt32-sc01-plus_new]
extends = arduino_esp32_v3
board = esp32s3_qio_qspi
;board = esp32-s3-devkitc-1 ; Or your specific SC01 Plus board variant

board_build.arduino.memory_type = qio_qspi 
board_build.mcu = esp32s3

board_build.embed_files =

build_flags =
    -D HASP_MODEL="SC01 Plus"
    ${arduino_esp32_v3.build_flags}
    ${esp32s3.ps_ram}
	-DUSE_USB_CDC_CONSOLE
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D HASP_LOG_LEVEL=9
    ;-D ARDUINO_USB_MODE=0
    -mtext-section-literals
    -Wa,-I${PROJECT_DIR}
    -I.pio/libdeps/${PIOENV}/lvgl
    ; -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"

;region -- LovyanGFX build options ------------------------
    -D LGFX_USE_V1=1
    -D WTSC01PLUS=1
    -D ST7796_DRIVER=1
    -D TOUCH_DRIVER=0x6336
    -D HASP_USE_LGFX_TOUCH=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D SPI_FREQUENCY=20000000
    -D TFT_RD=-1
    -D TFT_WR=47
    -D TFT_RS=0
    -DESP32_PARALLEL
    -D TFT_D0=9
    -D TFT_D1=46
    -D TFT_D2=3
    -D TFT_D3=8
    -D TFT_D4=18
    -D TFT_D5=17
    -D TFT_D6=16
    -D TFT_D7=15
    -D TFT_CS=-1
    -D TFT_RST=4
    -D TFT_BUSY=-1
    -D TFT_BCKL=45
    -D I2C_TOUCH_FREQUENCY=400000
    -D I2C_TOUCH_ADDRESS=0x38
    -D I2C_TOUCH_PORT=1
    -D TOUCH_SDA=6
    -D TOUCH_SCL=5
;endregion

build_unflags =
    -Wno-incompatible-pointer-types
    -D CONFIG_LOG_DEFAULT_LEVEL=0       ; Silences standard Espressif framework output strings
    -D CONFIG_COMPILER_OPTIMIZATION_ASSERTION_LEVEL=0  ; Silences all framework assert strings
    -D CONFIG_ESP_ERR_TO_NAME_LOOKUP=0  ; Removes large internal error-code-to-string lookup tables

lib_ldf_mode = deep+
lib_deps =
    ${arduino_esp32_v3.lib_deps}
    ${lovyangfx.lib_deps}

lib_ignore =
    ${arduino_esp32_v3.lib_ignore}

[env:wt32-sc01-plus_new_8MB]
extends = wt32-sc01-plus_new, flash_8mb
board_build.partitions = user_setups/esp32/partitions_v3_8MB.csv
; Voor de ESP32-S3 start de bootloader op 0x0000 in plaats van 0x1000.
board_build.partition_table_offset = 0xA000
board_build.flash_mode = dio

[env:wt32-sc01-plus_new_16MB]
extends = wt32-sc01-plus_new, flash_16mb