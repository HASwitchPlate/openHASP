;***************************************************;
;    Guition JC2432W328 - ESP32-WROOM 2.8" CYD      ;
;      - ST7789 TFT SPI 4-WIRE, 240x320             ;
;      - CST820 capacitive I2C touch controller     ;
;***************************************************;

[guition-jc2432w328]
extends = arduino_esp32_v2
board = esp32dev
upload_speed = 921600

build_flags =
    ${arduino_esp32_v2.build_flags}
    ${esp32.no_ps_ram}
    ${esp32.hspi}         ; Use HSPI hardware SPI bus
    -D LGFX_USE_V1=1
    -D SUPPORT_TRANSACTIONS

;region -- TFT_eSPI build options ------------------------
    -D ST7789_DRIVER=1
    -D INVERT_COLORS=0
    -D TFT_ROTATION=0 ; 0=0, 1=90, 2=180 or 3=270 degree
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=0
    -D TFT_RST=-1
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_CS=15
    -D TFT_MOSI=13
    -D TFT_MISO=12
    -D TFT_BCKL=27
    -D SPI_FREQUENCY=24000000
    -D SPI_READ_FREQUENCY=20000000
;endregion

;region -- Touch: CST820 capacitive, I2C ------------------
; NOTE: this board's ST7789/XPT2046 pins overlap with the Sunton
; ESP32-2432S028R "Cheap Yellow Display" family, but do NOT extend that
; board's env - it sets -D ESP32_2432S028R=1, which forces a hardcoded
; XPT2046-only touch branch in tft_driver_lovyangfx.cpp that ignores
; TOUCH_DRIVER entirely. This board's touch is CST820 capacitive (I2C),
; confirmed by chip marking, so it needs the generic TOUCH_DRIVER-based
; code path instead.
    -D HASP_USE_LGFX_TOUCH=1
    -D TOUCH_DRIVER=0x0820
    -D TOUCH_OFFSET_ROTATION=0
    -D I2C_TOUCH_PORT=I2C_NUM_0
    -D I2C_TOUCH_ADDRESS=0x15 ; Common CST8xx default - try 0x14/0x2E/0x38 if not detected
    -D I2C_TOUCH_FREQUENCY=400000
    -D TOUCH_SDA=33
    -D TOUCH_SCL=32
    -D TOUCH_RST=25
    -D TOUCH_IRQ=-1   ; INT pin is not connected on this board
;endregion

; -- Debugging options -----------------------------
;   -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG

lib_deps =
    ${arduino_esp32_v2.lib_deps}
    ${lovyangfx.lib_deps}


[env:guition-jc2432w328_4MB]
extends = guition-jc2432w328, flash_4mb
build_flags =
    ${guition-jc2432w328.build_flags}
    -D HASP_MODEL="Guition JC2432W328"
