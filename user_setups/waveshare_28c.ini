[env:waveshare-esp32-s3-28c]
extends = esp32s3_16mb_psram
board = esp32-s3-devkitc-1

build_flags =
    ${esp32s3_16mb_psram.build_flags}
    -w
    -D HASP_USE_TFT_ESPI=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=480
    -D TOUCH_DRIVER=0x0911
    -D TOUCH_SDA=15
    -D TOUCH_SCL=7
    -D TOUCH_INT=-1
    -D TOUCH_RST=-1
    -D TOUCH_IRQ=-1
    -D I2C_TOUCH_FREQUENCY=400000
    -D I2C_TOUCH_ADDRESS=0x5D

lib_deps =
    ${esp32s3_16mb_psram.lib_deps}
    bblanchon/ArduinoJson @ ^6.21.5
    bxparks/AceButton @ ^1.10.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/StreamUtils @ ^1.7.3
    bodmer/TFT_eSPI @ 2.5.43
